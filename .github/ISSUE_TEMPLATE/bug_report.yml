name: Bug report
description: Report a reproducible defect in recording, replay, panel, skills or CLI.
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not attach raw recordings, cookies, credentials,
        personal absolute paths, or full `.dsh/` directories.
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. pnpm install
        2. pnpm exec vitest run tests/...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Package version or `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - recording
        - replay / CLI
        - panel / HUD
        - skills
        - privacy / consent
        - docs
        - other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or error codes
      description: Paste error codes and short sanitized snippets. Remove user names and paths.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, cookies, personal paths, and raw recordings.
          required: true
